<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smanji slike</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --border: #dfe1e6;
    --text: #1b1f23;
    --muted: #6b7280;
    --accent: hsl(222 85% 56%);
    --accent-hover: hsl(222 70% 46%);
    --ok: #16a34a;
    --err: #d92d20;
    --warn: #b45309;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1c1f25;
      --border: #2c313a;
      --text: #e8eaed;
      --muted: #9aa1ac;
      --accent: hsl(222 100% 68%);
      --accent-hover: hsl(222 100% 76%);
      --ok: #4ade80;
      --err: #ff7b72;
      --warn: #f0b429;
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 16px 40px;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }
  header { margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 650; }
  .sub { color: var(--muted); font-size: 13px; }

  /* ---------- ostalo preuzeto iz makete (docs/superpowers/specs/2026-08-01-smanji-slike-playground.html), bez .app prefiksa ---------- */

  .hidden { display: none !important; }

  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 9px;
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 14px;
  }

  .drop {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    background: var(--panel);
    margin-bottom: 14px;
  }
  .drop b { color: var(--accent); font-weight: 600; }

  .prog {
    height: 4px;
    border-radius: 3px;
    background: var(--border);
    overflow: hidden;
    margin-bottom: 12px;
  }
  .prog > i { display: block; height: 100%; width: 72%; background: var(--accent); }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 14px;
  }
  .card-head {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .canvas-wrap {
    padding: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 240px;
    background-color: var(--panel);
    background-image:
      linear-gradient(45deg, rgba(128,128,128,.16) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(128,128,128,.16) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, rgba(128,128,128,.16) 75%),
      linear-gradient(-45deg, transparent 75%, rgba(128,128,128,.16) 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
  }
  .canvas-wrap canvas {
    max-width: 100%;
    max-height: 320px;
    display: block;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th {
    text-align: left;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--muted);
    font-weight: 700;
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
  }
  td { padding: 10px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }

  .zipbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--muted);
  }

  button {
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    padding: 5px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
  /* maketa nema opšte pravilo za onemogućeno dugme (samo inline primer za red sa greškom) — dodato ovde da dugme deluje sivo dok je disabled */
  button:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Smanji slike</h1>
    <p class="sub">Sve ostaje na tvom uređaju. Bez uploada, bez naloga, bez ograničenja.</p>
  </header>

  <div class="bar" id="traka"></div>
  <div class="drop" id="drop">Prevuci slike ovde ili <b>izaberi fajlove</b> &nbsp;·&nbsp; JPG, PNG, WEBP, GIF</div>
  <input type="file" id="fajlovi" multiple accept="image/*" hidden>
  <div class="prog hidden" id="prog"><i></i></div>
  <div class="card"><div class="card-head"><span>Pregled</span><span id="pregledInfo"></span></div>
    <div class="canvas-wrap"><canvas id="cv"></canvas></div></div>
  <div class="card"><div class="card-head"><span>Rezultati</span><span id="brojInfo"></span></div>
    <table><thead><tr><th></th><th>Fajl</th><th>Original</th><th>Novo</th><th>Ušteda</th><th></th></tr></thead>
    <tbody id="redovi"></tbody></table></div>
  <div class="zipbar"><span id="zbir"></span><button class="primary" id="zip" disabled>Preuzmi sve (ZIP)</button></div>
</div>

<script>
(function () {
  'use strict';

  // ---- podaci ----

  // ---- čiste funkcije ----

  // ---- slike ----

  // ---- obrada ----

  // ---- UI ----

  // ---- samoprovera: pokreće se samo kad adresa ima #test ----
  function samoprovera() {
    var pali = 0, ukupno = 0, redovi = [];

    function proveri(naziv, dobio, ocekivano) {
      ukupno++;
      var ok = JSON.stringify(dobio) === JSON.stringify(ocekivano);
      if (ok) pali++;
      redovi.push((ok ? 'OK   ' : 'PAO  ') + naziv +
        (ok ? '' : '\n       dobio: ' + JSON.stringify(dobio) +
                   '\n       očekivano: ' + JSON.stringify(ocekivano)));
    }

    // ---- tvrdnje ----
    proveri('kostur radi', 1 + 1, 2);

    // ---- ispis ----
    var pre = document.createElement('pre');
    pre.style.cssText = 'padding:20px;font:13px/1.7 ui-monospace,Consolas,monospace;white-space:pre-wrap';
    pre.textContent = pali + '/' + ukupno + ' prošlo\n\n' + redovi.join('\n');
    document.body.innerHTML = '';
    document.body.appendChild(pre);
    document.title = (pali === ukupno ? 'OK ' : 'PALO ') + pali + '/' + ukupno;
  }

  if (location.hash === '#test') { samoprovera(); return; }

  // ---- inicijalizacija UI-ja (kasniji zadaci dopunjuju ovaj deo) ----
})();
</script>
</body>
</html>
