<style>
  /* Fontovi su lokalni — aplikacija ne sme ništa da traži sa mreže.
     Fajlovi su Google Fonts latin/latin-ext podskupovi (varijabilni,
     osa težine), preuzeti u fonts/. Licenca: SIL Open Font License 1.1. */
  @font-face{
    font-family:'Archivo';
    font-style:normal;
    font-weight:400 600;
    font-stretch:100%;
    font-display:swap;
    src:url('fonts/archivo-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face{
    font-family:'Archivo';
    font-style:normal;
    font-weight:400 600;
    font-stretch:100%;
    font-display:swap;
    src:url('fonts/archivo-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face{
    font-family:'Martian Mono';
    font-style:normal;
    font-weight:600 700;
    font-stretch:100%;
    font-display:swap;
    src:url('fonts/martian-mono-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face{
    font-family:'Martian Mono';
    font-style:normal;
    font-weight:600 700;
    font-stretch:100%;
    font-display:swap;
    src:url('fonts/martian-mono-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  :root{
    --field:#2B302C;
    --field-deep:#222623;
    --bone:#EDE9DE;
    --bone-dim:#D5D0C2;
    --ink:#171916;
    --ink-soft:#6B6E66;
    --brass:#C29B4A;
    --red:#B4432F;
    --radius:14px;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{background:var(--field);}

  body{
    font-family:'Archivo',system-ui,-apple-system,sans-serif;
    color:var(--bone);
    min-height:100dvh;
    padding:0 16px calc(28px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  .wrap{max-width:520px;margin:0 auto}

  /* ---- header ---- */
  .bar{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:calc(20px + env(safe-area-inset-top)) 2px 14px;
    border-bottom:1px solid rgba(194,155,74,.35);
    margin-bottom:20px;
  }
  .mark{
    display:flex;align-items:center;gap:9px;
    font-family:'Martian Mono',ui-monospace,monospace;
    font-weight:700;font-size:15px;letter-spacing:.14em;
    color:var(--brass);
  }
  .mark svg{display:block;width:22px;height:22px;flex:0 0 auto}
  .edit-toggle{
    font:inherit;font-size:13px;font-weight:500;letter-spacing:.02em;
    background:none;border:0;color:var(--bone-dim);
    padding:8px 4px;cursor:pointer;
  }
  .edit-toggle.on{color:var(--brass)}

  /* ---- counter card ---- */
  .list{display:flex;flex-direction:column;gap:10px}

  .card{
    background:var(--bone);
    border-radius:var(--radius);
    padding:12px 14px 14px;
    border:0;width:100%;text-align:left;
    display:block;font:inherit;color:var(--ink);
    cursor:pointer;user-select:none;touch-action:manipulation;
    box-shadow:0 1px 0 rgba(255,255,255,.18) inset, 0 3px 10px rgba(0,0,0,.22);
    transition:transform .08s ease;
  }
  .card:active{transform:scale(.985)}
  .card:focus-visible{outline:3px solid var(--brass);outline-offset:3px}

  .card-name{
    font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  .card-row{display:flex;align-items:center;gap:12px}

  /* signature: recessed drum window */
  .drum{
    position:relative;flex:1;height:52px;overflow:hidden;
    display:grid;place-items:start center;
  }
  .drum::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(23,25,22,.14) 0%,rgba(23,25,22,0) 22%,rgba(23,25,22,0) 78%,rgba(23,25,22,.14) 100%);
  }
  .digits{
    grid-area:1/1;
    font-family:'Martian Mono',ui-monospace,monospace;
    font-weight:700;font-size:40px;line-height:52px;
    letter-spacing:-.02em;color:var(--ink);
  }

  .minus{
    flex:0 0 auto;width:52px;height:52px;border-radius:11px;
    border:1px solid rgba(23,25,22,.16);background:transparent;
    color:var(--ink-soft);font:inherit;font-size:24px;line-height:1;
    cursor:pointer;touch-action:manipulation;
  }
  .minus:active{background:rgba(23,25,22,.07)}

  /* ---- edit mode ---- */
  .card.editing{cursor:default}
  .card.editing:active{transform:none}

  .rename{
    width:100%;font:inherit;font-size:15px;font-weight:500;color:var(--ink);
    background:transparent;border:0;border-bottom:1px solid rgba(23,25,22,.22);
    padding:6px 0 7px;margin-bottom:10px;
  }
  .rename:focus{outline:none;border-bottom-color:var(--brass)}

  .card-tools{display:flex;gap:8px;margin-top:12px}
  .tool{
    flex:1;font:inherit;font-size:13px;font-weight:500;
    padding:11px 8px;border-radius:10px;cursor:pointer;
    border:1px solid rgba(23,25,22,.16);background:transparent;color:var(--ink-soft);
  }
  .tool.danger{color:var(--red);border-color:rgba(180,67,47,.4)}
  .tool.armed{background:var(--red);border-color:var(--red);color:var(--bone)}

  /* ---- empty ---- */
  .empty{
    border:1px dashed rgba(213,208,194,.3);border-radius:var(--radius);
    padding:26px 20px;text-align:center;color:var(--bone-dim);
    font-size:14px;line-height:1.55;
  }

  /* ---- add form ---- */
  .add{display:flex;gap:8px;margin-top:22px}
  .add-input{
    flex:1;font:inherit;font-size:15px;color:var(--bone);
    background:var(--field-deep);border:1px solid rgba(213,208,194,.18);
    border-radius:11px;padding:14px 14px;
  }
  .add-input::placeholder{color:rgba(213,208,194,.45)}
  .add-input:focus{outline:none;border-color:var(--brass)}
  .add-btn{
    font:inherit;font-size:14px;font-weight:600;letter-spacing:.02em;
    padding:0 20px;border-radius:11px;cursor:pointer;
    background:var(--brass);border:0;color:var(--field-deep);
  }
  .add-btn:active{filter:brightness(.92)}

  .note{
    margin-top:14px;font-size:12px;color:rgba(213,208,194,.55);
    min-height:16px;text-align:center;
  }

  @media (prefers-reduced-motion:reduce){
    .card:active{transform:none}
  }
</style>

<div class="wrap">
  <div class="bar">
    <div class="mark">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#2B302C"/>
        <rect x="10" y="10" width="44" height="4" rx="2" fill="#C29B4A"/>
        <rect x="10" y="19" width="44" height="31" rx="6" fill="#EDE9DE"/>
        <path d="M24 30 L31 24 L31 31 Z" fill="#171916"/>
        <rect x="29" y="24" width="6" height="17" fill="#171916"/>
        <rect x="23" y="40" width="18" height="4" rx="1" fill="#171916"/>
      </svg>
      BROJAČ
    </div>
    <button class="edit-toggle" id="editToggle" type="button">Uredi</button>
  </div>

  <div class="list" id="list"></div>

  <div class="add">
    <input class="add-input" id="newName" type="text" placeholder="Ime novog brojila" maxlength="28" enterkeyhint="done">
    <button class="add-btn" id="addBtn" type="button">Dodaj</button>
  </div>

  <div class="note" id="note"></div>
</div>

<script>
(function(){
  const KEY = 'brojac:v1';
  const listEl = document.getElementById('list');
  const noteEl = document.getElementById('note');
  const editToggle = document.getElementById('editToggle');
  const newName = document.getElementById('newName');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let counters = [];
  let editing = false;
  let armed = null;          // id brojila kod kojeg je "Obriši" naoružan
  let saveTimer = null;

  const pad = n => String(n).padStart(3, '0');
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function note(msg){
    noteEl.textContent = msg;
    if(msg) setTimeout(() => { if(noteEl.textContent === msg) noteEl.textContent = ''; }, 2600);
  }

  function load(){
    try{
      const parsed = JSON.parse(localStorage.getItem(KEY));
      if(Array.isArray(parsed)) counters = parsed;
    }catch(e){
      counters = [];      // prvi start, nema sačuvanog stanja ili privatni režim
    }
  }

  function save(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try{
        localStorage.setItem(KEY, JSON.stringify(counters));
      }catch(e){
        note('Nije sačuvano. Pokušaj ponovo.');
      }
    }, 350);
  }

  function buzz(ms){
    if(navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){}
  }

  /* Rolling digits — jedini pokret u aplikaciji */
  function rollTo(drum, text, dir){
    /* Poslednji span je cifra koja je na redu da ostane; sve pre njega su
       zaostaci prekinutih prevrtanja. querySelector bi vratio prvi, pa bi se
       pri brzom pritiskanju isti span vrteo dvaput dok bi oni između zauvek
       stajali jedan preko drugog — otud crna mrlja umesto cifre. */
    const svi = drum.querySelectorAll('.digits');
    const old = svi[svi.length - 1];
    if(!old || reduce || !old.animate){ drum.innerHTML = '<span class="digits">' + text + '</span>'; return; }
    if(old.textContent === text) return;
    for(let i = 0; i < svi.length - 1; i++) svi[i].remove();

    const incoming = document.createElement('span');
    incoming.className = 'digits';
    incoming.textContent = text;
    drum.appendChild(incoming);

    const d = dir > 0 ? -1 : 1;
    const t = { duration: 170, easing: 'cubic-bezier(.4,0,.2,1)' };
    old.animate([{transform:'translateY(0)',opacity:1},
                 {transform:'translateY(' + (d*100) + '%)',opacity:0}], t)
       .onfinish = () => old.remove();
    incoming.animate([{transform:'translateY(' + (-d*100) + '%)',opacity:0},
                      {transform:'translateY(0)',opacity:1}], t);
  }

  function bump(c, delta, cardEl){
    const next = Math.max(0, c.value + delta);
    if(next === c.value) return;
    c.value = next;
    rollTo(cardEl.querySelector('.drum'), pad(c.value), delta);
    buzz(delta > 0 ? 12 : 8);
    save();
  }

  function render(){
    listEl.innerHTML = '';

    if(counters.length === 0){
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'Nema brojila. Napiši ime dole i dodaj prvo.';
      listEl.appendChild(e);
      editToggle.style.visibility = 'hidden';
      return;
    }
    editToggle.style.visibility = 'visible';

    counters.forEach(c => {
      const card = document.createElement(editing ? 'div' : 'button');
      card.className = 'card' + (editing ? ' editing' : '');
      if(!editing) card.type = 'button';

      if(editing){
        const inp = document.createElement('input');
        inp.className = 'rename';
        inp.value = c.name;
        inp.maxLength = 28;
        inp.setAttribute('aria-label', 'Ime brojila');
        inp.addEventListener('input', () => { c.name = inp.value; save(); });
        card.appendChild(inp);
      }else{
        const nm = document.createElement('div');
        nm.className = 'card-name';
        nm.textContent = c.name;
        card.appendChild(nm);
      }

      const row = document.createElement('div');
      row.className = 'card-row';

      const drum = document.createElement('div');
      drum.className = 'drum';
      drum.innerHTML = '<span class="digits">' + pad(c.value) + '</span>';
      row.appendChild(drum);

      if(!editing){
        const minus = document.createElement('button');
        minus.type = 'button';
        minus.className = 'minus';
        minus.textContent = '−';
        minus.setAttribute('aria-label', 'Oduzmi jedan od ' + c.name);
        minus.addEventListener('click', ev => { ev.stopPropagation(); bump(c, -1, card); });
        row.appendChild(minus);
      }

      card.appendChild(row);

      if(editing){
        const tools = document.createElement('div');
        tools.className = 'card-tools';

        const reset = document.createElement('button');
        reset.type = 'button';
        reset.className = 'tool';
        reset.textContent = 'Vrati na nulu';
        reset.addEventListener('click', () => {
          c.value = 0; armed = null; save(); render();
        });

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'tool danger' + (armed === c.id ? ' armed' : '');
        del.textContent = armed === c.id ? 'Sigurno obriši' : 'Obriši';
        del.addEventListener('click', () => {
          if(armed === c.id){
            counters = counters.filter(x => x.id !== c.id);
            armed = null;
            if(counters.length === 0){ editing = false; editToggle.textContent = 'Uredi'; editToggle.classList.remove('on'); }
            save(); render();
          }else{
            armed = c.id; render();
          }
        });

        tools.appendChild(reset);
        tools.appendChild(del);
        card.appendChild(tools);
      }else{
        card.setAttribute('aria-label', 'Dodaj jedan na ' + c.name);
        card.addEventListener('click', () => bump(c, +1, card));
      }

      listEl.appendChild(card);
    });

    if(editing){
      const deleteAll = document.createElement('button');
      deleteAll.type = 'button';
      deleteAll.className = 'tool danger';
      deleteAll.textContent = 'Obriši sva brojila';
      deleteAll.addEventListener('click', () => {
        if(!window.confirm('Obrisati sva brojila? Ova radnja se ne može poništiti.')) return;
        counters = [];
        armed = null;
        editing = false;
        editToggle.textContent = 'Uredi';
        editToggle.classList.remove('on');
        save();
        render();
      });
      listEl.appendChild(deleteAll);
    }
  }

  function addCounter(){
    const name = newName.value.trim();
    if(!name){ newName.focus(); return; }
    counters.push({ id: uid(), name: name, value: 0 });
    newName.value = '';
    save(); render();
  }

  /* pointerdown + preventDefault: na telefonu tastatura zatvaranjem pomeri
     dugme pre nego što 'click' stigne, pa dodir promaši. Ne vraćati na 'click'. */
  const addBtn = document.getElementById('addBtn');
  addBtn.addEventListener('pointerdown', e => {
    e.preventDefault();
    addCounter();
  });
  // tastatura: Enter/Space na fokusiranom dugmetu daje click sa detail 0 —
  // pointerdown se tada ne javlja, pa ovo nije duplo okidanje
  addBtn.addEventListener('click', e => { if(e.detail === 0) addCounter(); });
  newName.addEventListener('keydown', e => { if(e.key === 'Enter') addCounter(); });

  editToggle.addEventListener('click', () => {
    editing = !editing;
    armed = null;
    editToggle.textContent = editing ? 'Gotovo' : 'Uredi';
    editToggle.classList.toggle('on', editing);
    render();
  });

  listEl.innerHTML = '<div class="empty">Učitavam…</div>';
  load();
  render();
})();

/* Service worker se prijavljuje tek na 'load' da ne uzima propusni opseg
   dok se stranica crta. Sa file:// prijava baca izuzetak — tamo aplikacija
   radi, samo bez instalacije, pa se i ne pokušava. */
(function(){
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol !== 'http:' && location.protocol !== 'https:') return;
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
})();
</script>
